<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채용 공고 </title>
    <link rel="stylesheet" href="../assets/recult.css">
    <link rel="stylesheet" href="../assets/header.css">
    <!-- 푸터 css적용 -->
    <link rel="stylesheet" href="../assets/footer.css">
</head>
<body>
    {% include 'header.html' %}

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-container">
        <!-- 타이틀 -->
        <div class="page-title-area">
            <h1>채용 공고</h1>
            <p>다양한 기업의 채용 정보를 확인하세요.</p>
        </div>

        <!-- 검색 영역 -->
        <div class="search-area">
            <input type="text" placeholder="검색" class="search-input">
        </div>

        <!-- 게시판 (테이블) 영역 -->

        
        <div class="table-area">
     

<div class="table-header">
    <span>기관명</span>
    <span>공고명</span>
    <span>채용 인원</span>
    <span>채용 구분</span>
    <span>상세</span>
</div>

{% for job in jobs %}
    {% if job.ongoing_yn == 'Y' %}
    <div class="table-row">
        <span class="col" data-label="기관명">
            {{ job.inst_nm }}
        </span>

        <span class="col" data-label="공고명">
            {{ job.recrut_pbanc_ttl }}
        </span>

        <span class="col" data-label="채용 인원">
            {{ job.recrut_nope }}명
        </span>

        <span class="col" data-label="채용 구분">
            {{ job.recrut_se_nm }}
        </span>

        <span class="col" data-label="상세">
            <a href="https://job.alio.go.kr/mobile2021/recruit/recruitView.do?idx={{ job.recrut_pblnt_sn }}"
               class="detail-link"
               target="_blank">
                상세보기
            </a>
        </span>
    </div>
    {% endif %}
{% endfor %}


        <!-- 페이지네이션 영역 -->
        <div class="pagination">
            <button class="page-btn arrow">◀</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">4</button>
            <button class="page-btn">5</button>
            <button class="page-btn arrow">▶</button>
            <span class="page-text">페이지</span>
        </div>
    </main>

    <!-- 하단 푸터 영역 -->
   {% include 'footer.html' %} 
</body>
</html>
