<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 정보 수정 - 취업 할래말래</title>
    <link rel="stylesheet" href="../assets/edit-profile.css">
    <!-- 폰트어썸 (사용자 프로필 아이콘 렌더링용) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 상단 임시 헤더 -->
    <header class="wireframe-header">
        헤더
    </header>

    <!-- 메인 레이아웃 컨테이너 -->
    <main class="mypage-container">
        <!-- 좌측 사이드바 영역 -->
        <aside class="sidebar">
            <h2 class="sidebar-title">마이페이지</h2>
            <ul class="sidebar-menu">
                <li><a href="#" class="active">회원 정보 수정</a></li>
                <li><a href="#">쓴 글 목록</a></li>
                <li><a href="#">찜한 공고 목록</a></li>
                <li><a href="#">일대일 문의</a></li>
            </ul>
        </aside>

        <!-- 우측 메인 콘텐츠 영역 (정보 수정 폼) -->
        <section class="content-box">
            <div class="form-container">
                <!-- 프로필 아바타 -->
                <div class="avatar-area">
                    <div class="avatar">
                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>

                <!-- 입력 폼 영역 -->
                <form class="edit-form">
                    <div class="input-group">
                        <input type="text" value="아이디 (표시 전용)" disabled class="disabled-input">
                        <input type="password" placeholder="비밀번호">
                        <input type="password" placeholder="비밀번호 확인">
                        <input type="text" placeholder="닉네임">
                        <input type="text" placeholder="주소">
                        <input type="email" placeholder="이메일">
                        <input type="tel" placeholder="전화번호">
                    </div>
                    
                    <!-- 하단 액션 버튼 -->
                    <div class="btn-group">
                        <button type="submit" class="btn btn-confirm">확인</button>
                        <button type="button" class="btn btn-cancel">취소</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- 하단 임시 푸터 -->
    <footer class="wireframe-footer">
        푸터
    </footer>
</body>
</html>
