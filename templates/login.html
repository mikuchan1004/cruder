
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 취업 할래말래</title>
    <link rel="stylesheet" href="/assets/login.css">
</head>
<body>

    <div class="login-container">

        <!-- 로그인 제목 -->
        <h1 class="page-title">LOGIN</h1>

        <!-- 로그인 입력 영역 -->
        <div class="login-content">

            <!-- 아이디 및 비밀번호 -->
            <div class="form-section">

                <form
                    id="login-form"
                    class="login-form"
                    method="post"
                    action="/jobgogo/login"
                >

                    <!-- 아이디 -->
                    <input
                        type="text"
                        name="user_id"
                        maxlength="12"
                        placeholder="아이디 입력"
                        class="form-input"
                        autocomplete="username"
                        required
                    >

                    <!-- 로그인 실패 메시지 -->
                    {% if login_error %}
                    <p class="error-message">
                        {{ login_error }}
                    </p>
                    {% endif %}

                    <!-- 비밀번호 -->
                    <input
                        type="password"
                        name="user_pw"
                        placeholder="비밀번호 입력"
                        class="form-input"
                        autocomplete="current-password"
                        required
                    >

                </form>

            </div>

            <!-- 로그인 버튼 -->
            <div class="button-section">
                <button
                    type="submit"
                    form="login-form"
                    class="btn-login"
                >
                    로그인
                </button>
            </div>

        </div>

        <!-- 하단 메뉴 -->
        <div class="login-links">

            <div class="signup-prompt">
                <span>아직 회원이 아니신가요?</span>

                <a href="/jobgogo/signup" class="link-purple">
                    회원가입
                </a>
            </div>

            <a href="/jobgogo" class="link-purple link-main">
                메인으로
            </a>

        </div>

    </div>

</body>
</html>
