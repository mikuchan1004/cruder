<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 취업 할래말래</title>
    <link rel="stylesheet" href="../assets/login.css">
</head>
<body>
    <div class="login-container">
        <h1 class="page-title">LOGIN</h1>
        
        <div class="login-content">
            <!-- 좌측 입력 폼 영역 -->
            <div class="form-section">
                <form class="login-form">
                    <input type="text" placeholder="아이디 입력" class="form-input">
                    <!-- 에러 메시지 노출 영역 -->
                    <p class="error-message">! 아이디 혹은 비밀번호가 틀립니다</p>
                    <input type="password" placeholder="비밀번호 입력" class="form-input">
                </form>
            </div>

            <!-- 우측 로그인 버튼 영역 -->
            <div class="button-section">
                <button type="submit" class="btn-login">로그인</button>
            </div>
        </div>

        <!-- 하단 보조 링크 영역 -->
        <div class="login-links">
            <span class="warning-text">경고창</span>
            <div class="signup-prompt">
                <span>아직 회원이 아니신가요?</span>
                <a href="#" class="link-purple">회원가입</a>
            </div>
            <a href="#" class="link-purple link-main">메인으로</a>
        </div>
    </div>
</body>
</html>
