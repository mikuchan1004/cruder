<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 문의 - 취업 할래말래</title>
    <link rel="stylesheet" href="../assets/inquiry.css">
</head>
<body>
    <!-- 상단 헤더 영역 -->
    <header class="main-header">
        <div class="header-left">
            <h1 class="logo">&lt;로고 삽입&gt;</h1>
            <nav class="gnb">
                <ul>
                    <li><a href="#">공지사항</a></li>
                    <li><a href="#">채용 공고</a></li>
                    <li><a href="#">취업 꿀팁</a></li>
                </ul>
            </nav>
        </div>
        <div class="header-right">
            <a href="#" class="admin-link">관리자 페이지</a>
            <button type="button" class="btn-logout">로그아웃</button>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="inquiry-main">
        <div class="inquiry-container">
            
            <!-- 좌측: 1:1 문의 작성 영역 -->
            <section class="inquiry-write-box">
                <input type="text" class="input-title" placeholder="제목">
                <textarea class="input-content" placeholder="내용을 입력."></textarea>
                <button type="button" class="btn-submit">1:1 문의 등록</button>
            </section>

            <!-- 우측: 1:1 문의 답변 확인 영역 -->
            <section class="inquiry-reply-box">
                <h2 class="reply-title">1:1 문의 답변 내용</h2>
                <div class="reply-content">
                    <p>해당 사항은 현재로써 처리할 수 없습니다.</p>
                </div>
            </section>
            
        </div>
    </main>

    <!-- 하단 푸터 영역 -->
    <footer class="main-footer">
        &lt;푸터 삽입&gt;
    </footer>
</body>
</html>
