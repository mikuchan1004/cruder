<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>취업 꿀팁 상세보기</title>

    <link rel="stylesheet" href="/assets/recult-read.css">
    <link rel="stylesheet" href="/assets/header.css">
    <link rel="stylesheet" href="/assets/footer.css">

    <style>
        .jobtip-content {
            min-height: 250px;
            padding: 20px;
            overflow-wrap: anywhere;
            line-height: 1.8;
        }

        .jobtip-content img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    {% include 'header.html' %}

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-container">

        <!-- 취업 꿀팁 제목 -->
        <div class="job-title-area">
            <h1>{{ job.job_tip_title }}</h1>
            <span class="company-name">취업 꿀팁</span>
        </div>

        <!-- 게시글 정보 -->
        <div class="info-box top-box">

            <div class="info-item">
                <span class="label">글번호</span>
                <span class="value">{{ job.job_tip_no }}</span>
            </div>

            <div class="info-item">
                <span class="label">작성자</span>
                <span class="value">{{ job.user_id }}</span>
            </div>

            <div class="info-item">
                <span class="label">작성일</span>
                <span class="value">
                    {{ job.job_tip_date.strftime('%Y-%m-%d') if job.job_tip_date else '' }}
                </span>
            </div>

        </div>

        <!-- 게시글 본문 -->
        <div class="info-box bottom-box">

            <div class="info-item">
                <span class="label">내용</span>
            </div>

           <div class="jobtip-content">
            <div id="post-detail">
                {{ job.job_tip_detail | safe }}
            </div>

            {% for image in attachment_paths %}
                <img src="{{ image }}" alt="첨부 이미지">
            {% endfor %}
            </div>

            <script>
                // 이전에 저장된 임시 blob 이미지 제거
                document.querySelectorAll('#post-detail img').forEach(function(img) {
                    if (img.getAttribute('src')?.startsWith('blob:')) {
                        img.remove();
                    }
                });
            </script>
        <!-- 하단 버튼 -->
        <div class="button-group">

            <button
                type="button"
                class="btn btn-primary"
                onclick="location.href='/jobgogo/jobtip'">
                목록으로
            </button>


            <!-- 삭제 버튼 -->
            <form
                action="/jobtip/{{ job.job_tip_no }}/delete"
                method="post"
                onsubmit="return confirm('정말 삭제하시겠습니까?');"
                style="display: inline;"
            >
                <button
                    type="submit"
                    class="btn btn-cancel">
                    삭제
                </button>
            </form>

        </div>

    </main>

    <!-- 하단 푸터 -->
    {% include 'footer.html' %}

</body>
</html>
