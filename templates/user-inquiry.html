<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최근 질문한 목록 - 취업 할래말래</title>
    <link rel="stylesheet" href="user-inquiry.css">
    <!-- FontAwesome (사용자 프로필 아이콘 렌더링용) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 상단 임시 헤더 -->
    <header class="wireframe-header">
        헤더
    </header>

    <!-- 메인 레이아웃 컨테이너 -->
    <main class="mypage-container">
        <!-- 좌측 사이드바 영역 -->
        <aside class="sidebar">
            <h2 class="sidebar-title">마이페이지</h2>
            <ul class="sidebar-menu">
                <li><a href="#">회원 정보 수정</a></li>
                <li><a href="#">쓴 글 목록</a></li>
                <li><a href="#">찜한 공고 목록</a></li>
                <li><a href="#" class="active">일대일 문의</a></li>
            </ul>
        </aside>

        <!-- 우측 메인 콘텐츠 영역 -->
        <section class="content-area">
            <!-- 사용자 정보 및 타이틀 -->
            <div class="user-greeting">
                <div class="avatar">
                    <i class="fa-regular fa-user"></i>
                </div>
                <h3>OOO 님이 최근 질문한 목록</h3>
            </div>

            <!-- 질문 목록 테이블 -->
            <div class="board-table">
                <!-- 데스크톱용 테이블 헤더 -->
                <div class="table-header">
                    <div class="col-status">답변 상태</div>
                    <div class="col-title">제목</div>
                    <div class="col-date">작성일</div>
                    <div class="col-reply-date">답변일</div>
                </div>
                
                <!-- 리스트 아이템 1 -->
                <div class="table-row">
                    <div class="col-status" data-label="답변 상태">완료</div>
                    <div class="col-title" data-label="제목"><a href="#">ai는 어떻게 쓰나요?</a></div>
                    <div class="col-date" data-label="작성일">1750-05-11</div>
                    <div class="col-reply-date" data-label="답변일">2026-10-01</div>
                </div>

                <!-- 리스트 아이템 2 -->
                <div class="table-row">
                    <div class="col-status" data-label="답변 상태">대기</div>
                    <div class="col-title" data-label="제목"><a href="#">추천이 이상한데요?</a></div>
                    <div class="col-date" data-label="작성일">2010-07-15</div>
                    <div class="col-reply-date" data-label="답변일">답변 없음</div>
                </div>
            </div>
        </section>
    </main>

    <!-- 하단 액션 버튼 영역 -->
    <div class="bottom-action">
        <button type="button" class="btn-return">마이페이지로</button>
    </div>

    <!-- 하단 임시 푸터 -->
    <footer class="wireframe-footer">
        푸터
    </footer>
</body>
</html>
