<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 맞춤 공고 결과 - 취업 할래말래</title>
    <link rel="stylesheet" href="ai-chat-result.css">
    <!-- FontAwesome (로봇 아이콘 렌더링용) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 상단 임시 헤더 -->
    <header class="wireframe-header">
        헤더
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="chat-result-main">
        <div class="result-container">
            
            <!-- AI 메세지 영역 -->
            <section class="ai-message-section">
                <div class="bot-icon">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="message-box outline-yellow">
                    <p>입력하신 직무와 기술 스택을 기준으로 관련 채용공고를 찾아봤어요</p>
                </div>
            </section>

            <!-- 추천 공고 테이블 영역 -->
            <section class="recommended-jobs-section">
                <div class="board-table">
                    <!-- 테이블 헤더 -->
                    <div class="table-header">
                        <div class="col-company">회사명</div>
                        <div class="col-title">공고명</div>
                        <div class="col-exp">경력</div>
                        <div class="col-loc">지역</div>
                        <div class="col-detail">상세</div>
                    </div>
                    
                    <!-- 리스트 아이템 1 -->
                    <div class="table-row">
                        <div class="col-company" data-label="회사명">네이버</div>
                        <div class="col-title font-bold" data-label="공고명">백엔드 개발자 모집</div>
                        <div class="col-exp font-bold" data-label="경력">3년이상</div>
                        <div class="col-loc" data-label="지역">천안시 동남구</div>
                        <div class="col-detail"><a href="#" class="btn-detail">상세보기</a></div>
                    </div>

                    <!-- 리스트 아이템 2 -->
                    <div class="table-row">
                        <div class="col-company" data-label="회사명">구글</div>
                        <div class="col-title font-bold" data-label="공고명">백엔드 개발자 모집</div>
                        <div class="col-exp font-bold" data-label="경력">5년이상</div>
                        <div class="col-loc" data-label="지역">천안시 서북구</div>
                        <div class="col-detail"><a href="#" class="btn-detail">상세보기</a></div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- 하단 임시 푸터 -->
    <footer class="wireframe-footer">
        &lt;푸터 삽입&gt;
    </footer>
</body>
</html>
