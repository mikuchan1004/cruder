<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자페이지 - 문의관리</title>
    <link rel="stylesheet" href="../assets/admin-inquiry.css">
</head>
<body>
    <!-- 상단 헤더 영역 -->
    <header class="admin-header">
        <div class="header-left">
            <h1 class="logo">관리자페이지</h1>
            <nav class="gnb">
                <ul>
                    <li><a href="#">대시보드</a></li>
                    <li><a href="#">회원관리</a></li>
                    <li><a href="#">게시물관리</a></li>
                    <li><a href="#">채용 공고 관리</a></li>
                    <li><a href="#" class="active">문의관리</a></li>
                </ul>
            </nav>
        </div>
        <div class="header-right">
            <span class="admin-greeting">관리자님 환영합니다</span>
            <button type="button" class="btn-logout">로그아웃</button>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="admin-main">
        <div class="page-header">
            <h2 class="section-title">문의관리</h2>
            <select class="status-filter">
                <option value="all">전체</option>
                <option value="pending">답변대기</option>
                <option value="completed">답변완료</option>
            </select>
        </div>
        
        <div class="content-wrapper">
            <!-- 좌측 문의 목록 테이블 영역 -->
            <section class="inquiry-list-section">
                <div class="board-table">
                    <!-- 테이블 헤더 -->
                    <div class="table-header">
                        <div class="col" data-label="글 번호">글 번호</div>
                        <div class="col" data-label="회원">회원</div>
                        <div class="col" data-label="유형">유형</div>
                        <div class="col" data-label="제목">제목</div>
                        <div class="col" data-label="상태">상태</div>
                    </div>
                    
                    <!-- 리스트 아이템 1 -->
                    <div class="table-row">
                        <div class="col font-bold" data-label="글 번호">1</div>
                        <div class="col font-bold" data-label="회원">user1</div>
                        <div class="col font-bold" data-label="유형">AI 채팅</div>
                        <div class="col font-bold truncate" data-label="제목">AI 채팅은 어디서 할 수 있나요</div>
                        <div class="col" data-label="상태"><span class="badge pending">답변대기</span></div>
                    </div>

                    <!-- 리스트 아이템 2 -->
                    <div class="table-row text-gray">
                        <div class="col" data-label="글 번호">2</div>
                        <div class="col" data-label="회원">user2</div>
                        <div class="col" data-label="유형">사이트 이용</div>
                        <div class="col truncate" data-label="제목">회원 탈퇴는 어디서 할 수 있나요</div>
                        <div class="col" data-label="상태"><span class="badge completed">답변완료</span></div>
                    </div>
                </div>
            </section>

            <!-- 우측 문의 답변 폼 영역 -->
            <section class="inquiry-reply-section">
                <div class="reply-box">
                    <h3 class="reply-title">문의 답변</h3>
                    
                    <div class="inquiry-info">
                        <h4 class="inquiry-type">AI 채팅</h4>
                        <p class="inquiry-question">AI 채팅은 어디서 할 수 있나요</p>
                    </div>
                    
                    <div class="reply-form">
                        <label class="reply-label">답변</label>
                        <textarea class="reply-textarea" placeholder="답변 내용을 입력해주세요.">AI 채팅은 메인페이지의 공고 영역 하단에 있는 버튼을 누르시면 됩니다. 감사합니다.</textarea>
                    </div>
                    
                    <button type="button" class="btn-submit">답변 등록</button>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
