<header class="header">
    <!-- 좌측 로고 -->
    <div class="logo">
        <!-- <a href="/">
            <img src="/static/images/logo.png" alt="취업할래말래 로고">
        </a> -->
        <a href="/jobgogo">
            <img src="/assets/logo_anime_style.png" alt="취업할래말래 로고">
        </a>
    </div>

    <!-- 중앙 메뉴 -->
    <nav class="gnb">
        <ul>
            <li><a href="#">공지사항</a></li>
            <li><a href="#">채용 공고</a></li>
            <li><a href="#">취업 꿀팁</a></li>
        </ul>
    </nav>

    <!-- 우측 사용자 메뉴 -->
    <div class="user-menu">

        {% if user_id %}

            {% if user_status_id == 1 %}
                <a href="/jobgogo/admin" class="admin-link">
                    관리자 페이지
                </a>
            {% endif %}

            <span class="greeting">
                {{ user_name }}님 환영합니다
            </span>

            <a href="/jobgogo/mypage" class="mypage-link">
                마이페이지
            </a>

            <a href="/logout" class="btn-logout">
                로그아웃
            </a>

        {% else %}

            <a href="/jobgogo/login" class="mypage-link">
                로그인
            </a>

            <a href="/jobgogo/signup" class="mypage-link">
                회원가입
            </a>
        {% endif %}
    </div>
    <button class="mobile-menu-btn">☰</button>
</header>
