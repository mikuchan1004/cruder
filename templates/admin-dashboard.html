<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자페이지 - 대시보드</title>
    <link rel="stylesheet" href="../assets/admin-dashboard.css">
</head>
<body>
    <!-- 상단 헤더 영역 -->
    <header class="admin-header">
        <div class="header-left">
            <h1 class="logo">관리자페이지</h1>
            <nav class="gnb">
                <ul>
                    <li><a href="/admin" class="active">대시보드</a></li>
                    <li><a href="/admin-users">회원관리</a></li>
                    <li><a href="#">게시물관리</a></li>
                    <li><a href="#">채용 공고 관리</a></li>
                    <li><a href="#">문의관리</a></li>
                </ul>
            </nav>
        </div>
        <div class="header-right">
            <span class="admin-greeting">관리자님 환영합니다</span>
            <button type="button" class="btn-logout">로그아웃</button>
        </div>
    </header>

    <!-- 메인 대시보드 콘텐츠 영역 -->
    <main class="admin-main">
        <h2 class="section-title">대시보드</h2>
        
        <!-- 대시보드 상단 요약 및 빠른 이동 영역 -->
        <section class="dashboard-top">
            <!-- 요약 통계 카드 그룹 -->
            <div class="stats-group">
                <div class="stat-card">
                    <h3>총 회원 수</h3>
                    <p class="stat-number">{{total_users_count}}명</p>
                </div>
                <div class="stat-card">
                    <h3>API 호출 건수</h3>
                    <p class="stat-number">{{total_api_call_count}}건</p>
                </div>
            </div>
            
            <!-- 빠른 이동 링크 카드 -->
            <div class="quick-links-card">
                <h3>빠른 이동</h3>
                <div class="quick-links-buttons">
                    <a href="/admin-users" class="btn-outline-purple">회원관리</a>
                    <a href="#" class="btn-outline-purple">게시물관리</a>
                    <a href="/jobgogo" class="btn-outline-purple">메인페이지 이동</a>
                </div>
            </div>
        </section>

        <!-- 공지사항 테이블 영역 -->
        <section class="recent-posts">
            <h2 class="section-title">공지사항</h2>
            
            <div class="board-table">
                <!-- 데스크톱용 테이블 헤더 -->
                <div class="table-header">
                    <div class="col-title">제목</div>
                    <div class="col-author">작성자</div>
                    <div class="col-date">작성일</div>
                </div>
                
                {% for notice in notices %}
                <div class="table-row">
                        <div class="col-title" data-label="제목">{{notice.notice_title}}</div>
                        <div class="col-author" data-label="작성자">{{notice.user_id}}</div>
                        <div class="col-date" data-label="작성일">{{notice.notice_date}}</div>
                    </div>
                {% endfor %}
            </div>
        </section>
    </main>
</body>
</html>
