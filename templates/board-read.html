<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세 와이어프레임</title>
    <link rel="stylesheet" href="board-read.css">
</head>
<body>
    <!-- 상단 헤더 영역 -->
    <header class="wireframe-header">
        헤더
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-container">
        <!-- 상단 게시글 메타 정보 영역 -->
        <div class="post-header">
            <div class="header-left">
                <span class="col-num">번호</span>
                <span class="col-title">제목</span>
            </div>
            <div class="header-right">
                <span class="col-author">글쓴이</span>
                <span class="col-date">날짜</span>
                <span class="col-views">조회수</span>
            </div>
        </div>

        <!-- 게시글 본문 영역 -->
        <div class="post-content">
            <div class="content-text">
                글 내용
            </div>
            <!-- 액션 버튼 영역 -->
            <div class="action-area">
                <button type="button" class="btn-report">신고하기</button>
            </div>
        </div>
    </main>
</body>
</html>
