<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채용 공고 상세 와이어프레임</title>
    <link rel="stylesheet" href="../assets/recult-read.css">
</head>
<body>
    <!-- 상단 헤더 영역 -->
    <header class="wireframe-header">
        헤더
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-container">
        <!-- 공고 제목 및 기관명 -->
        <div class="job-title-area">
            <h1>채용 공고 제목</h1>
            <span class="company-name">기관명</span>
        </div>

        <!-- 첫 번째 정보 박스 (근무지, 기간 등) -->
        <div class="info-box top-box">
            <div class="info-item">
                <span class="label">근무지</span>
                <span class="value">전북</span>
            </div>
            <div class="info-item">
                <span class="label">채용 구분명</span>
                <span class="value">0명</span>
            </div>
            <div class="info-item">
                <span class="label">채용 인원</span>
                <span class="value">0명</span>
            </div>
            <div class="info-item">
                <span class="label">공고 시작일</span>
                <span class="value">상세내용</span>
            </div>
            <div class="info-item">
                <span class="label">공고 종료일</span>
                <span class="value">상세내용</span>
            </div>
        </div>

        <!-- 두 번째 정보 박스 (진행 여부 등) -->
        <div class="info-box bottom-box">
            <div class="info-item">
                <span class="label">진행 여부</span>
                <span class="value">상세내용</span>
            </div>
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="button-group">
            <button type="button" class="btn btn-primary">찜하기</button>
            <button type="button" class="btn btn-primary">원문링크</button>
        </div>
    </main>

    <!-- 하단 푸터 영역 -->
    <footer class="wireframe-footer">
        푸터
    </footer>
</body>
</html>
